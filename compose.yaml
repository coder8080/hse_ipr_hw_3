services:
  app:
    build: .
    ports:
      - ${PORT:-8080}:${PORT:-8000}
    env_file: .env
    environment:
      - STORAGE=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://app:${PORT:-8000}/healthz"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    read_only: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'


  redis:
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7 # 10.11.2026, amd64
    volumes:
      - hse_redis:/data
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s


volumes:
  hse_redis:
